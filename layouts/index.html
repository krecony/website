{{ define "main" }}
{{ $disableImageOptimization := .Site.Params.disableImageOptimization | default false }}
<div class="flex flex-col mt-10 lg:flex-row lg:mt-0 w-full h-full items-center overflow-hidden justify-around">
  <div class="font-mono flex flex-col justify-center items-center text-center">
    <div class="prose dark:prose-invert">
      <h1>{{ .Site.Params.Author.nickname }}</h1>
    </div>
    <h2 class="text-neutral-500 dark:text-neutral-400 mt-2 mb-3">{{ .Site.Params.Author.bio | markdownify }}</h2>
    <div class="text-neutral-500 dark:text-neutral-400 flex items-center justify-center gap-x-5">
      {{ range .Site.Params.Author.links }}
      <a href="{{ .link }}">
        <i alt="{{ .name }}" data-feather="{{ .icon }}"></i>
      </a>
      {{ end }}
    </div>
  </div>
  {{ partial "boids.html" . }}
</div>
{{ end }}
