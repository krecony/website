{{ define "main" }}
  {{ $disableImageOptimization := .Site.Params.disableImageOptimization | default false }}
  <article
    class="py-[15%] flex flex-col items-center justify-center text-center font-mono">
    <header class="flex justify-between items-center w-full max-w-[80%]">
      <h1 class="row-span-full m-0 text-4xl font-medium">
        {{ .Site.Params.Author.name | default .Site.Title }}
      </h1>
			<div class="max-w-[50%] flex flex-col gap-y-3 text-left text-l">
				<h2 class="m-0 text-neutral-500 dark:text-neutral-400">
					{{ .Site.Params.Author.bio | markdownify }}
				</h2>
				<div class="m-0 text-neutral-500 dark:text-neutral-400 flex items-center justify-center gap-x-5">
					{{ range .Site.Params.Author.links }}
						<a href="{{ .link }}">
							<i alt="{{ .name }}" data-feather="{{ .icon }}"></i>
						</a>
					{{ end }}
					<script>
						feather.replace()
					</script>
				</div>
			</div>
    </header>
    <section class="prose dark:prose-invert w-full">{{ .Content }}</section>
  </article>
{{ end }}
