{{ define "main" }}
{{ $disableImageOptimization := .Site.Params.disableImageOptimization | default false }}
<div class="flex flex-col mt-10 lg:mt-0 w-full h-full overflow-hidden relative justify-around">
  <div class="font-mono flex flex-col justify-center items-center text-center lg:absolute lg:left-1/4 lg:transform lg:-translate-x-1/2 lg:h-full lg:justify-center">
    <div class="prose dark:prose-invert">
      <h1>{{ .Site.Params.Author.nickname }}</h1>
    </div>
    <h2 class="lg:text-nowrap text-neutral-500 dark:text-neutral-400 mt-2 mb-3">
      {{ .Site.Params.Author.bio | markdownify }}
    </h2>
    <div class="text-neutral-500 dark:text-neutral-400 flex items-center justify-center gap-x-5">
      {{ range .Site.Params.Author.links }}
      <a href="{{ .link }}">
        <i alt="{{ .name }}" data-feather="{{ .icon }}"></i>
      </a>
      {{ end }}
    </div>
  </div>
  <div class="w-full h-2/3 lg:absolute lg:right-0 lg:h-full lg:w-1/2 flex-shrink-0">{{ partial "boids.html" . }}</div>
</div>
{{ end }}
